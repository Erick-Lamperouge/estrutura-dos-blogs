name: Blog engine V2 - preview checks
on:
  push:
    branches: ['dev/blog-engine-v2']
    paths:
      - 'v2/**'
      - '.github/workflows/blog-engine-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-engine-v2-ci
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configuration contract
        run: npm test
      - name: Install preview dependencies
        run: npm install --no-audit --no-fund
      - name: Compile preview
        run: npm run build
      - name: Verify generated routes
        run: |
          test -s dist/futebolando/index.html
          test -s dist/culinaria-demo/index.html
          grep -q 'noindex,nofollow' dist/futebolando/index.html
          grep -q 'noindex,nofollow' dist/culinaria-demo/index.html
          test -s dist/futebolando/en/index.html
          test -s dist/culinaria-demo/en/index.html
          grep -q 'lang="en"' dist/futebolando/en/index.html
          grep -q 'lang="pt-BR"' dist/futebolando/index.html
          grep -q 'The story kicks off here' dist/futebolando/en/index.html
          grep -q 'data-highlight-mode="curated-preview"' dist/futebolando/en/index.html
          grep -q 'data-football-centre' dist/futebolando/index.html
          grep -q 'data-competition="brasileirao"' dist/futebolando/index.html
          grep -q 'data-competition="world-cup"' dist/futebolando/en/index.html
          ! grep -q 'data-football-centre' dist/culinaria-demo/index.html
          grep -q 'href="/futebolando/en/"' dist/futebolando/index.html
          grep -q 'href="/futebolando/"' dist/futebolando/en/index.html
          grep -q 'noindex,nofollow' dist/futebolando/en/index.html
          grep -q 'noindex,nofollow' dist/culinaria-demo/en/index.html
          test -s dist/futebolando/artigos/impedimento/index.html
          test -s dist/futebolando/en/articles/offside/index.html
          test -s dist/futebolando/artigos/impedimento-reinicios/index.html
          test -s dist/futebolando/en/articles/offside-restarts/index.html
          grep -q 'noindex,nofollow' dist/futebolando/artigos/impedimento/index.html
          grep -q 'noindex,nofollow' dist/futebolando/en/articles/offside/index.html
          test -s dist/blog-font-licenses/barlow-condensed.txt
          test -s dist/blog-font-licenses/source-serif-4.txt
          test -s dist/blog-font-licenses/inter.txt
          test -s dist/futebolando/artigos/bola-em-jogo/index.html
          test -s dist/futebolando/en/articles/ball-in-play/index.html
          test -s dist/futebolando/artigos/oito-segundos-goleiro/index.html
          test -s dist/futebolando/en/articles/goalkeeper-eight-seconds/index.html
          test -s dist/futebolando/series/index.html
          test -s dist/futebolando/series/regras-do-jogo/index.html
          test -s dist/futebolando/en/series/index.html
          test -s dist/futebolando/en/series/laws-of-the-game/index.html
          test -s dist/futebolando/media/ball-line-schematic.svg
          test -s dist/futebolando/media/goalkeeper-clock-schematic.svg
          grep -q 'noindex,nofollow' dist/futebolando/series/regras-do-jogo/index.html
          for path in real-madrid-historia libertadores-formato barcelona-jogo-posicional xg-gols-esperados; do
            test -s "dist/futebolando/artigos/$path/index.html"
            grep -q 'noindex,nofollow' "dist/futebolando/artigos/$path/index.html"
          done
          for path in real-madrid-history libertadores-format barcelona-positional-play expected-goals; do
            test -s "dist/futebolando/en/articles/$path/index.html"
            grep -q 'noindex,nofollow' "dist/futebolando/en/articles/$path/index.html"
          done
          for path in clubs competitions numbers tactics; do
            test -s "dist/futebolando/series/$path/index.html"
            test -s "dist/futebolando/en/series/$path/index.html"
          done
          test -s dist/futebolando/media/xg-example.svg
          grep -q 'data-stat-example="illustrative"' dist/futebolando/artigos/xg-gols-esperados/index.html
      - name: Verify SEO inventory and release safeguards
        run: node scripts/verify-seo-preview.mjs
      - name: Verify isolated publication build
        run: node scripts/test-publication-build.mjs
      - name: Generate editorial review queue
        run: npm run review:queue
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test design and capture screenshots
        run: node test/browser-preview.mjs
      - name: Upload design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-design-review
          path: v2/review-shots/
          if-no-files-found: ignore
          retention-days: 14
